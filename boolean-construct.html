<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boolean Construct · Sarbesh-OS</title>
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0C10'/%3E%3Ccircle cx='12.5' cy='16' r='7.5' fill='%23CCFF00' fill-opacity='.85'/%3E%3Ccircle cx='19.5' cy='16' r='7.5' fill='%2300E5FF' fill-opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,200..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#0B0C10; --bg2:#111319; --surface:#171A22; --border:rgba(255,255,255,0.10);
    --accent:#CCFF00; --accent2:#FFB020; --accent3:#00E5FF;
    --text:#E8EAF0; --muted:#8B90A0; --white:#ffffff;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text);
    background-color:var(--bg);
    background-image:
      radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1.2px),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:18px 18px, 90px 90px, 90px 90px;
    background-attachment:fixed;
    font-family:'DM Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; position:relative;
    padding:28px 16px;
    cursor:none;
  }
  @media (pointer:coarse){ body{ cursor:auto; } .cursor-dot,.cursor-ring{ display:none !important; } }

  /* ---------- Sarbesh-OS window chrome (shared across every game) ---------- */
  .os-window{
    border:1px solid rgba(255,255,255,0.10); border-radius:16px; overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.85), 0 0 0 1px rgba(0,0,0,0.6);
    background:linear-gradient(180deg, #12141B 0%, #0E1015 100%);
  }
  .os-titlebar{
    display:flex; flex-wrap:nowrap; align-items:center; gap:10px; container-type:inline-size; flex:0 0 auto;
    padding:10px 16px; background:#0D0F14; border-bottom:1px solid rgba(255,255,255,0.10);
  }
  .os-lights{ display:flex; gap:6px; }
  .os-lights span{ width:12px; height:12px; border-radius:50%; }
  .os-path{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .os-path b{ color:var(--text); font-weight:400; }
  .os-lights{ flex-shrink:0; }
  .os-path{ flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .os-pill{ flex-shrink:0; }
  @media (max-width: 480px){ .os-titlebar{ gap:8px; } }
  /* phones: show just the file name and tighten type so the bar stays on one line */
  @container (max-width: 440px){ .os-path-dir, .os-path-ext{ display:none; } .os-lights{ gap:5px; } .os-lights span{ width:10px; height:10px; } .os-path{ font-size:11.5px; } .os-pill{ font-size:10.5px; padding:4px 10px; } }
  .os-pill{
    margin-left:auto; white-space:nowrap; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent);
    padding:4px 12px; border-radius:999px; border:1px solid rgba(204,255,0,0.3); background:rgba(204,255,0,0.07);
  }

  /* ---------- custom cursor ---------- */
  .cursor-dot,.cursor-ring{ position:fixed; top:0; left:0; border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:background .15s ease, border-color .15s ease, width .18s var(--ease), height .18s var(--ease); }
  .cursor-dot{ width:8px; height:8px; background:var(--accent); }
  .cursor-ring{ width:36px; height:36px; border:1.5px solid var(--accent); }
  body.cursor-hover .cursor-dot{ background:var(--accent2); }
  body.cursor-hover .cursor-ring{ border-color:var(--accent2); width:46px; height:46px; }

  /* ---------- layout shell ---------- */
  .app{ position:relative; z-index:1; height:100%; max-width:1180px; margin:0 auto; display:flex; flex-direction:column; }

  header.hud{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; }
  .hud-left .icon-btn{ opacity:.7; }
  .stage-label{ font-size:14px; font-weight:600; letter-spacing:.2px; }
  .stage-label .cat{ color:var(--muted); font-weight:400; margin-left:4px; }
  .hud-right{ display:flex; align-items:center; gap:6px; }
  .icon-btn{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; color:var(--text); cursor:none;
  }
  .icon-btn:hover{ background:var(--surface); border-color:var(--border); }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn:disabled{ opacity:.25; pointer-events:none; }

  main.stage{ flex:1 1 auto; position:relative; display:flex; overflow:hidden; }

  /* ---------- bank ---------- */
  .bank{
    width:300px; flex:0 0 auto; padding:36px 24px; display:grid; grid-template-columns:repeat(2, 110px); gap:20px;
    align-content:flex-start; border-right:1px solid var(--border);
  }
  .bank-cell{ width:110px; height:110px; display:flex; align-items:center; justify-content:center; }
  .bank-piece{
    background:var(--white); position:relative; touch-action:none;
    transition:opacity .3s var(--ease), background .3s ease;
  }
  .bank-piece.dragging{ z-index:50; position:fixed; pointer-events:none; transition:box-shadow .15s ease, filter .15s ease; }
  .bank-piece.dragging.drag-valid{
    box-shadow:0 0 0 3px var(--accent2), 0 18px 30px -10px rgba(255,176,32,.4);
    filter:brightness(1.04);
  }
  .bank-piece.used{ opacity:.14; background:var(--surface) !important; box-shadow:none !important; }
  .bank-piece[data-type="rect"]{ border-radius:2px; }
  .bank-piece[data-type="roundrect"]{ border-radius:22px; }
  .bank-piece[data-type="circle"]{ border-radius:50%; }

  /* ---------- workspace ---------- */
  .workspace-wrap{ flex:1 1 auto; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:18px; }

  .op-row{ display:flex; gap:10px; min-height:40px; }
  .op-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.4px;
    padding:9px 18px; border-radius:100px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    cursor:none; opacity:0; transform:translateY(6px); pointer-events:none;
    transition:opacity .25s var(--ease), transform .25s var(--ease), border-color .2s ease, background .2s ease;
  }
  .op-btn.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .op-btn:hover{ border-color:var(--accent); background:#1D2029; }
  .op-btn:active{ transform:scale(.95); }

  .canvas-panel{
    position:relative; width:340px; height:340px; border:1px solid var(--border); background:var(--bg2);
    border-radius:6px;
    perspective:2200px;
    transition:box-shadow .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .canvas-panel .tilt-inner{
    width:100%; height:100%; transform-style:preserve-3d; transform-origin:50% 85%;
    transition:transform .55s var(--ease);
  }
  .canvas-panel.tilted .tilt-inner{ transform:rotateX(9deg); }
  .canvas-panel.tilted{ box-shadow:0 30px 60px -24px rgba(0,0,0,.55); }
  canvas#work{ display:block; width:100%; height:100%; }

  .peek-overlay{
    position:absolute; inset:0; background:var(--bg2); display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .peek-overlay.show{ opacity:1; }
  .peek-overlay canvas{ width:100%; height:100%; }

  .drop-target{ position:absolute; }

  /* ---------- footer controller ---------- */
  footer.controller{
    display:flex; justify-content:center; gap:34px; padding:16px 0 26px; flex:0 0 auto;
    opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .3s var(--ease), transform .3s var(--ease);
  }
  footer.controller.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .ctl-btn{ display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; color:var(--accent2); cursor:none; }
  .ctl-btn svg{ width:22px; height:22px; }
  .ctl-btn span{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
  .ctl-btn:hover span{ color:var(--text); }

  /* ---------- intro / preview stage ---------- */
  .intro-overlay{
    position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    z-index:20; opacity:1; transition:opacity .4s ease;
  }
  .intro-overlay.hide{ opacity:0; pointer-events:none; }
  .intro-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:1px; color:var(--muted); }
  .intro-canvas-box{ width:280px; height:280px; }
  .intro-timer{ font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--accent); }

  /* ---------- toasts ---------- */
  .toast{
    position:absolute; top:0; left:0; right:0; background:#0D0F14; border-bottom:1px solid var(--border);
    padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    transform:translateY(-100%); transition:transform .35s var(--ease); z-index:30;
  }
  .toast.show{ transform:translateY(0); }
  .toast p{ margin:0; font-size:14px; color:var(--text); }
  .toast b{ color:var(--accent2); font-weight:600; cursor:none; }
  .toast .ok-btn{ font-family:'DM Sans',system-ui,sans-serif; font-weight:600; font-size:13px; background:none; border:none; color:var(--accent); cursor:none; }

  /* ---------- stage clear ---------- */
  .clear-overlay{
    position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
    background:rgba(11,12,16,.92); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .4s var(--ease);
  }
  .clear-overlay.show{ opacity:1; pointer-events:auto; }
  .clear-title{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:56px; letter-spacing:1px; color:var(--accent); text-shadow:0 0 40px rgba(204,255,0,.35); }
  .stars{ display:flex; gap:10px; }
  .stars svg{ width:34px; height:34px; fill:var(--accent2); opacity:0; transform:scale(.4) rotate(-25deg); transition:opacity .3s var(--ease), transform .4s var(--ease); }
  .clear-overlay.show .stars svg{ opacity:1; transform:scale(1) rotate(0); }
  .clear-overlay.show .stars svg:nth-child(1){ transition-delay:.1s; }
  .clear-overlay.show .stars svg:nth-child(2){ transition-delay:.25s; }
  .clear-overlay.show .stars svg:nth-child(3){ transition-delay:.4s; }
  .clear-actions{ display:flex; gap:12px; margin-top:6px; }
  .pill-btn{
    font-family:'DM Sans',system-ui,sans-serif; font-weight:600; font-size:13px; padding:11px 20px; border-radius:100px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:none;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .pill-btn:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .pill-btn.primary{ background:var(--accent); color:#0B0C10; border-color:var(--accent); }
  .pill-btn.primary:hover{ background:#DBFF4D; }

  .badge{ font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 12px; border-radius:100px; border:1px solid var(--border); color:var(--muted); }

  /* ---------- onboarding ---------- */
  .onboard-overlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:rgba(11,12,16,.86); backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .35s var(--ease);
  }
  .onboard-overlay.show{ opacity:1; pointer-events:auto; }
  .onboard-card{
    width:380px; max-width:88vw; background:var(--bg2); border:1px solid var(--border); border-radius:14px;
    padding:32px 30px 26px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
    transform:translateY(10px) scale(.98); transition:transform .35s var(--ease);
  }
  .onboard-overlay.show .onboard-card{ transform:translateY(0) scale(1); }
  .onboard-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; color:var(--muted); margin-bottom:4px; }
  .onboard-art{ width:100%; height:120px; display:flex; align-items:center; justify-content:center; margin:6px 0 10px; }
  .onboard-art svg{ width:110px; height:110px; }
  .onboard-title{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:24px; letter-spacing:0; color:var(--text); }
  .onboard-body{ font-size:13.5px; line-height:1.55; color:var(--muted); margin:8px 0 4px; max-width:300px; }
  .onboard-dots{ display:flex; gap:6px; margin:10px 0 18px; }
  .onboard-dots span{ width:6px; height:6px; border-radius:50%; background:var(--border); transition:background .2s ease, transform .2s ease; }
  .onboard-dots span.active{ background:var(--accent); transform:scale(1.3); }
  .onboard-actions{ width:100%; display:flex; align-items:center; justify-content:space-between; }
  .onboard-actions-right{ display:flex; gap:8px; }
  .onboard-skip{ font-family:'DM Sans',system-ui,sans-serif; font-size:12.5px; color:var(--muted); background:none; border:none; cursor:none; }
  .onboard-skip:hover{ color:var(--text); }

  @media (max-width:480px){ .onboard-card{ padding:26px 20px 20px; } }

  @media (max-width: 780px){
    body{ padding:12px 10px; }
    main.stage{ flex-direction:column; overflow:auto; }
    .bank{ width:100%; border-right:none; border-bottom:1px solid var(--border); padding:20px; }
    .canvas-panel{ width:280px; height:280px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="app os-window">

  <div class="os-titlebar">
    <div class="os-lights" aria-hidden="true"><span style="background:#FF3366"></span><span style="background:#FFB020"></span><span style="background:#CCFF00"></span></div>
    <span class="os-path"><span class="os-path-dir">~/sarbesh-os/apps/</span><b>boolean_construct</b><span class="os-path-ext">.exe</span></span>
    <span class="os-pill">Sarbesh Lal Amatya</span>
  </div>

  <header class="hud">
    <div class="hud-left">
      <button class="icon-btn" title="Levels" id="btnMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      </button>
      <div class="stage-label"><span id="stageTitle">—</span><span class="cat" id="stageCat"> in Boolean Studies</span></div>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="btnHelp" title="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 2-2.5 3.2"/><line x1="12" y1="16.5" x2="12" y2="16.6"/></svg>
      </button>
      <button class="icon-btn" id="btnPeek" title="Peek at the target">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="btnReset" title="Restart stage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15A9 9 0 1 1 22 12"/></svg>
      </button>
      <button class="icon-btn" id="btnPrev" title="Previous stage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="btnNext" title="Next stage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">

    <div class="bank" id="bank"></div>

    <div class="workspace-wrap">
      <div class="op-row" id="opRow">
        <button class="op-btn" data-op="union">UNION</button>
        <button class="op-btn" data-op="subtract">SUBTRACT</button>
        <button class="op-btn" data-op="intersect">INTERSECT</button>
        <button class="op-btn" data-op="difference">DIFFERENCE</button>
      </div>

      <div class="canvas-panel" id="canvasPanel">
        <div class="tilt-inner">
          <canvas id="work" width="340" height="340"></canvas>
        </div>
        <div class="peek-overlay" id="peekOverlay"><canvas id="peekCanvas" width="340" height="340"></canvas></div>
      </div>

      <div class="badge" id="matchBadge">MATCH · 0%</div>
    </div>

    <div class="toast" id="toastOops">
      <p>Oops, that was wrong. <b id="toastStartOver">Start Over</b> or <b id="toastUndo">Undo</b></p>
      <button class="ok-btn" id="toastOk">OK</button>
    </div>

    <div class="clear-overlay" id="clearOverlay">
      <div class="clear-title">STELLAR</div>
      <div class="stars">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L6 21l1.7-7L2.3 9.2l7.1-.6z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L6 21l1.7-7L2.3 9.2l7.1-.6z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L6 21l1.7-7L2.3 9.2l7.1-.6z"/></svg>
      </div>
      <div class="clear-actions">
        <button class="pill-btn" id="btnPlayAgain">Play again</button>
        <button class="pill-btn" id="btnShare">Share stage</button>
        <button class="pill-btn primary" id="btnContinue">Continue</button>
      </div>
    </div>

    <div class="intro-overlay" id="introOverlay">
      <div class="intro-eyebrow">STAGE PREVIEW</div>
      <div class="intro-canvas-box"><canvas id="introCanvas" width="280" height="280"></canvas></div>
      <div class="intro-timer" id="introTimer">3</div>
    </div>

  </main>

  <div class="onboard-overlay" id="onboardOverlay">
    <div class="onboard-card">
      <div class="onboard-eyebrow">HOW TO PLAY</div>
      <div class="onboard-art" id="onboardArt"></div>
      <div class="onboard-title" id="onboardTitle"></div>
      <p class="onboard-body" id="onboardBody"></p>
      <div class="onboard-dots" id="onboardDots"></div>
      <div class="onboard-actions">
        <button class="onboard-skip" id="onboardSkip">Skip</button>
        <div class="onboard-actions-right">
          <button class="pill-btn" id="onboardBack">Back</button>
          <button class="pill-btn primary" id="onboardNext">Next</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="controller" id="controller">
    <button class="ctl-btn" id="btnStartOver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15A9 9 0 1 1 22 12"/></svg>
      <span>Start Over</span>
    </button>
    <button class="ctl-btn" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
      <span>Undo</span>
    </button>
  </footer>

</div>

<script>
(function(){
  "use strict";

  /* ============ CURSOR ============ */
  const dot = document.querySelector('.cursor-dot');
  const ring = document.querySelector('.cursor-ring');
  window.addEventListener('pointermove', e=>{
    dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
    ring.style.left = e.clientX+'px'; ring.style.top = e.clientY+'px';
    const el = document.elementFromPoint(e.clientX,e.clientY);
    const interactive = el && el.closest('button, .bank-piece, [data-interactive]');
    document.body.classList.toggle('cursor-hover', !!interactive);
  });

  /* ============ SHAPE / MASK HELPERS ============ */
  const W = 340, H = 340;

  function polygonVertices(shape){
    const n = shape.sides, rot = shape.rotation||0;
    const pts = [];
    const starMode = shape.type === 'star';
    const count = starMode ? n*2 : n;
    for(let i=0;i<count;i++){
      const ang = rot - Math.PI/2 + i*(Math.PI*2/count);
      const rad = starMode ? (i%2===0 ? shape.r : shape.r*(shape.innerRatio||0.5)) : shape.r;
      pts.push([shape.cx + rad*Math.cos(ang), shape.cy + rad*Math.sin(ang)]);
    }
    return pts;
  }

  function pathFor(ctx, shape){
    ctx.beginPath();
    if(shape.type === 'circle'){
      ctx.arc(shape.cx, shape.cy, shape.r, 0, Math.PI*2);
    } else if(shape.type === 'roundrect'){
      ctx.roundRect(shape.x, shape.y, shape.w, shape.h, shape.r||0);
    } else if(shape.type === 'polygon' || shape.type === 'star'){

      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };

    function makeTitle(usedTitles){
      for(let tries=0; tries<400; tries++){
        const t = pick(WORDS_A)+' '+pick(WORDS_B);
        if(!usedTitles.has(t)){ usedTitles.add(t); return t; }
      }
      let n=1; const base = pick(WORDS_A)+' '+pick(WORDS_B);
      while(usedTitles.has(base+' '+n)) n++;
      const t = base+' '+n; usedTitles.add(t); return t;
    }

    function tryGenerateOne(templateList, acceptedBits, usedTitles){
      for(let attempt=0; attempt<50; attempt++){
        const candidate = pick(templateList)();
        const shapes = candidate.shapes;
        for(const key of Object.keys(shapes)){ shapes[key].id = key; shapes[key].bankType = shapes[key].type; }
        let boundsOk = true;
        for(const key of Object.keys(shapes)){ if(!inBounds(shapes[key])){ boundsOk=false; break; } }
        if(!boundsOk) continue;
        if(!everyPieceMatters(shapes, candidate.recipe)) continue;
        const mask = buildSmallMask(shapes, candidate.recipe);
        const bits = alphaBits(mask);
        const frac = bitArea(bits)/(VS*VS);
        if(frac<0.05 || frac>0.62) continue;
        let dupe = false;
        for(const b of acceptedBits){ if(jaccard(bits,b) > 0.88){ dupe=true; break; } }
        if(dupe) continue;
        acceptedBits.push(bits);
        const requiredIds = shuffle(Object.keys(shapes)); // vary bank ordering so it never feels indexed/sequential
        const title = makeTitle(usedTitles);
        const category = TIER_CATEGORY[requiredIds.length] || 'Intermediate Stages';
        return { title, category, shapes, recipe: candidate.recipe, requiredIds };
      }
      return null;
    }

      while(out.length < count && guard < count*80){

        if(lvl) out.push(lvl);

    const intermediate = generateTier(44, TEMPLATES_3, acceptedBits, usedTitles);
    const advanced = generateTier(15, TEMPLATES_4, acceptedBits, usedTitles);

    const procedural = shuffle([...foundational, ...intermediate, ...advanced]);
    procedural.forEach((lvl, i) => { lvl.id = 'stage'+(i+4); });

    window.__BOOLEAN_LEVELS__ = [...HALLMARK_LEVELS, ...procedural];

  function loadLevel(idx, {skipIntro=false} = {}){
    cancelActiveDrag();
    levelIndex = (idx + LEVELS.length) % LEVELS.length;
    level = LEVELS[levelIndex];
    pieces = []; bankUsed = new Set(); history = []; solved = false;
    document.getElementById('stageTitle').textContent = level.title;
    document.getElementById('stageCat').textContent = ' in ' + level.category;
    document.getElementById('btnPeek').disabled = false;
    clearOverlay.classList.remove('show');
    toastOops.classList.remove('show');
    buildBank();
    refreshAll();
    if(skipIntro){ dismissIntro(true); } else { runIntro(); }
  }

  /* ---------- intro / 3s preview ---------- */
  let introHandle = null;
  function runIntro(){
    introOverlay.classList.remove('hide');
    const ctx = introCanvas.getContext('2d');
    ctx.clearRect(0,0,280,280);
    ctx.save(); ctx.scale(280/W, 280/H);
    ctx.drawImage(tintMask(level.targetMaskCanvas, '#CCFF00', '#00E5FF'), 0, 0);
    ctx.restore();
    let t = 3;
    introTimer.textContent = t;
    clearInterval(introHandle);
    introHandle = setInterval(()=>{
      t -= 1;
      if(t <= 0){ clearInterval(introHandle); dismissIntro(); }
      else introTimer.textContent = t;
    }, 1000);
  }
  function dismissIntro(){
    clearInterval(introHandle);
    introOverlay.classList.add('hide');
  }
  introOverlay.addEventListener('click', dismissIntro);

  /* ---------- bank ---------- */
  function allShapeDefs(){
    // Only the shapes actually required to construct the target output are ever shown.
    return level.requiredIds.map(id => level.shapes[id]);
  }

  // Compute this shape's true footprint (from its actual target geometry) so the
  // bank icon reflects its real proportions — a tall rectangle should look tall,
  // not be squashed into a square, and an N-gon keeps its real silhouette.
  function shapeFootprint(def){
    const bb = shapeBBox(def);
    return { w: bb.maxX-bb.minX, h: bb.maxY-bb.minY, bb };
  }

  function clipPathFor(def, bb){
    const pts = polygonVertices(def);
    const w = bb.maxX-bb.minX, h = bb.maxY-bb.minY;
    const pct = pts.map(([x,y]) => `${((x-bb.minX)/w*100).toFixed(2)}% ${((y-bb.minY)/h*100).toFixed(2)}%`);
    return `polygon(${pct.join(', ')})`;
  }

  function buildBank(){
    cancelActiveDrag();
    bankEl.innerHTML = '';
    allShapeDefs().forEach(def=>{
      const cell = document.createElement('div');
      cell.className = 'bank-cell';
      const el = document.createElement('div');
      el.className = 'bank-piece';
      el.dataset.type = def.bankType;
      el.dataset.id = def.id;
      const fp = shapeFootprint(def);
      const scale = BANK_SIZE / Math.max(fp.w, fp.h);
      const dispW = Math.round(fp.w * scale);
      const dispH = Math.round(fp.h * scale);
      el.style.width = dispW+'px'; el.style.height = dispH+'px';
      if(def.bankType === 'roundrect'){
        el.style.borderRadius = Math.round((def.r||0) * scale)+'px';
      } else if(def.bankType === 'polygon' || def.bankType === 'star'){
        el.style.clipPath = clipPathFor(def, fp.bb);
      }
      cell.appendChild(el);
      bankEl.appendChild(cell);
      attachDrag(el, def);
    });
  }

  // ---- drag safety net: guarantees a level switch or reset can never leave a
  // shape stuck mid-flight (position:fixed) overlapping the fresh bank layout.
  let activeDrag = null;
  function cancelActiveDrag(){
    if(!activeDrag) return;
    const { el, pointerId } = activeDrag;
    try{ el.releasePointerCapture(pointerId); }catch(_){}
    el.classList.remove('dragging', 'drag-valid');
    el.style.left = ''; el.style.top = '';
    activeDrag = null;
    hoverTargetId = null;
    draw();
  }

  function attachDrag(el, def){
    let sx=0, sy=0, startRect=null, dragging=false;
    el.addEventListener('pointerdown', (e)=>{
      if(bankUsed.has(def.id) || solved) return;
      cancelActiveDrag();
      dragging = true;
      activeDrag = { el, pointerId: e.pointerId };
      startRect = el.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      el.style.width = startRect.width+'px';
      el.style.height = startRect.height+'px';
      el.style.left = startRect.left+'px';
      el.style.top = startRect.top+'px';
    });
    el.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      el.style.left = (startRect.left+dx)+'px';
      el.style.top = (startRect.top+dy)+'px';
      const target = document.getElementById('work').getBoundingClientRect();
      const inside = e.clientX>=target.left && e.clientX<=target.right && e.clientY>=target.top && e.clientY<=target.bottom;
      el.classList.toggle('drag-valid', inside);
      // Highlight only this piece's own target slot — not the whole frame.
      const nextHover = inside ? def.id : null;
      if(nextHover !== hoverTargetId){ hoverTargetId = nextHover; draw(); }
    });
    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      activeDrag = null;
      el.classList.remove('dragging', 'drag-valid');
      hoverTargetId = null;
      const target = document.getElementById('work').getBoundingClientRect();
      const inside = e.clientX>=target.left && e.clientX<=target.right && e.clientY>=target.top && e.clientY<=target.bottom;
      el.style.left = ''; el.style.top = '';
      if(inside){
        try{ placeShape(def); }catch(err){ console.error('placeShape failed', err); recoverFromError(); }
      }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function placeShape(def){
    if(bankUsed.has(def.id) || solved) return;
    pushHistory();
    bankUsed.add(def.id);
    pieces.push({ kind:'raw', shapeId:def.id, sourceIds:[def.id] });
    refreshAll();
  }

  /* ---------- rendering ---------- */
  function maskForPiece(p){
    if(p.kind==='mask') return p.canvas;
    const def = level.shapes[p.shapeId];
    return maskCanvasFromShape(def);
  }

  let hoverTargetId = null; // id of the required shape whose slot should be highlighted right now

  function draw(){
    workCtx.clearRect(0,0,W,H);
    // dashed skeleton for required shapes not yet resolved into final mask
    if(!solved){
      level.requiredIds.forEach(id=>{
        const isHover = id === hoverTargetId;
        workCtx.save();
        workCtx.setLineDash(isHover ? [] : [5,6]);
        if(isHover){
          pathFor(workCtx, level.shapes[id]);
          workCtx.fillStyle = 'rgba(255,176,32,.16)';
          workCtx.fill();
        }
        workCtx.strokeStyle = isHover ? '#FFB020' : 'rgba(255,255,255,.16)';
        workCtx.lineWidth = isHover ? 2.25 : 1.5;
        pathFor(workCtx, level.shapes[id]);
        workCtx.stroke();
        workCtx.restore();
      });
    }
    pieces.forEach((p,i)=>{
      if(p.kind==='mask'){
        workCtx.drawImage(tintMask(p.canvas, '#CCFF00', '#00E5FF'), 0, 0);
      } else {
        const def = level.shapes[p.shapeId];
        workCtx.fillStyle = i===0 ? 'rgba(232,232,232,.92)' : 'rgba(255,176,32,.5)';
        pathFor(workCtx, def);
        workCtx.fill();
      }
    });
  }

  function refreshAll(){
    // self-heal: the bank should always have exactly level.requiredIds.length
    // pieces in it. If it doesn't (any bug, anywhere), rebuild rather than
    // leaving the player looking at an empty, stuck bank.
    if(level && bankEl.children.length !== level.requiredIds.length){
      buildBank();
    }
    // bank dim state — bankEl.children are the .bank-cell wrappers; the actual
    // .bank-piece (which carries dataset.id and the 'used' styling) is nested inside.
    [...bankEl.children].forEach(cell=>{
      const el = cell.children[0];
      if(el) el.classList.toggle('used', bankUsed.has(el.dataset.id));
    });
    draw();
    // op buttons
    const showOps = pieces.length >= 2 && !solved;
    opRow.querySelectorAll('.op-btn').forEach(b=> b.classList.toggle('show', showOps));
    // controller
    controller.classList.toggle('show', pieces.length > 0 && !solved);
    document.getElementById('btnUndo').style.opacity = history.length ? '1' : '.35';
    // tilt — only once shapes are actually overlapping/combining, kept subtle so geometry stays legible
    canvasPanel.classList.toggle('tilted', pieces.length >= 2 || (pieces.length===1 && pieces[0].kind==='mask'));
    // match badge (best-effort continuous readout when reducible to single piece)
    if(pieces.length===1){
      const m = matchScore(maskForPiece(pieces[0]), level.targetMaskCanvas);
      matchBadge.textContent = 'MATCH · ' + Math.round(m*100) + '%';
    } else {
      matchBadge.textContent = 'MATCH · —';
    }
  }

  function applyOp(op){
    if(pieces.length < 2 || solved) return;
    pushHistory();
    let ordered = pieces;
    if(op === 'subtract' && pieces.length === 2 && pieces.every(p => p.kind === 'raw')){
      // "Subtract" removes one shape from another, so which piece the player
      // happened to drag in first shouldn't determine the outcome — every
      // template in this game is designed as "cut the smaller feature out of
      // the larger base", so that's the convention we apply here regardless
      // of drag order. (Every later step already has a well-defined order:
      // the accumulated result-so-far is always the base being modified.)
      const areas = pieces.map(p => filledArea(maskForPiece(p)));
      if(areas[0] < areas[1]) ordered = [pieces[1], pieces[0]];
    }
    const canvases = ordered.map(maskForPiece);
    const resultCanvas = combineMasks(op, canvases);
    const sourceIds = ordered.reduce((a,p)=>a.concat(p.sourceIds), []);
    pieces = [{ kind:'mask', canvas:resultCanvas, sourceIds }];
    refreshAll();
    checkVictory();
  }

  function checkVictory(){
    if(pieces.length !== 1 || pieces[0].kind !== 'mask') return;
    const p = pieces[0];
    const score = matchScore(p.canvas, level.targetMaskCanvas);
    if(score >= 1){
      stageClear();
    } else {
      const allRequiredUsed = level.requiredIds.every(id => p.sourceIds.includes(id));
      if(allRequiredUsed) showOops();
    }
  }

  function showOops(){ toastOops.classList.add('show'); }
  function hideOops(){ toastOops.classList.remove('show'); }

  function stageClear(){
    solved = true;
    refreshAll();
    canvasPanel.classList.remove('tilted');
    setTimeout(()=> clearOverlay.classList.add('show'), 250);
  }

  /* ---------- controls wiring ---------- */
  opRow.querySelectorAll('.op-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> applyOp(btn.dataset.op));
  });

  document.getElementById('btnUndo').addEventListener('click', doUndo);
  document.getElementById('toastUndo').addEventListener('click', ()=>{ doUndo(); hideOops(); });
  function doUndo(){
    if(!history.length) return;
    const snap = history.pop();
    restore(snap);
  }

  document.getElementById('btnStartOver').addEventListener('click', doStartOver);
  document.getElementById('toastStartOver').addEventListener('click', ()=>{ doStartOver(); hideOops(); });
  function doStartOver(){
    cancelActiveDrag();
    pieces = []; bankUsed = new Set(); history = []; solved = false;
    clearOverlay.classList.remove('show');
    buildBank(); // full rebuild — guarantees the bank can never be left stuck/stale
    refreshAll();
  }

  document.getElementById('toastOk').addEventListener('click', hideOops);

  document.getElementById('btnReset').addEventListener('click', ()=> loadLevel(levelIndex, {skipIntro:true}));
  document.getElementById('btnPrev').addEventListener('click', ()=> loadLevel(levelIndex-1));
  document.getElementById('btnNext').addEventListener('click', ()=> loadLevel(levelIndex+1));
  document.getElementById('btnMenu').addEventListener('click', ()=> loadLevel(levelIndex, {skipIntro:true}));

  const btnPeek = document.getElementById('btnPeek');
  function showPeek(){
    const ctx = peekCanvas.getContext('2d');
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(tintMask(level.targetMaskCanvas, '#CCFF00', '#00E5FF'), 0, 0);
    peekOverlay.classList.add('show');
  }
  function hidePeek(){ peekOverlay.classList.remove('show'); }
  btnPeek.addEventListener('pointerdown', showPeek);
  btnPeek.addEventListener('pointerup', hidePeek);
  btnPeek.addEventListener('pointerleave', hidePeek);

  document.getElementById('btnPlayAgain').addEventListener('click', doStartOver);
  document.getElementById('btnContinue').addEventListener('click', ()=> loadLevel(levelIndex+1));
  document.getElementById('btnShare').addEventListener('click', ()=>{
    const text = 'I just solved "'+level.title+'" in Boolean Studies \u2014 3/3.';
    if(navigator.share){ navigator.share({ text }).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(text); }
  });

  /* ---------- boot ---------- */
  if(safeLocalStorageGet(ONBOARD_KEY)){
    gameStarted = true;
    loadLevel(0);
  } else {
    openOnboarding();
  }

})();
</script>
</body>
</html>
