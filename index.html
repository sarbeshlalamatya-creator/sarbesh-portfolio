<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARBESH.OS — Boot Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a;
    --gold:#e6b455;
    --teal:#5ad4c8;
    --text-faint:#565f72;
    --border:#1c2330;
    --font-mono:'JetBrains Mono', monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--gold);
    font-family:var(--font-mono);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* faint scanline + noise texture, matches the main portfolio */
  body::before{
    content:'';
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 3px);
  }

  #boot{
    position:relative;z-index:2;
    width:min(520px,88vw);
  }

  #boot-lines div{
    opacity:0;
    white-space:pre-wrap;
    margin-bottom:8px;
    font-size:13px;
    letter-spacing:.02em;
  }
  #boot-lines div.show{opacity:1;}
  #boot-lines .cursor{
    display:inline-block;width:8px;height:14px;
    background:var(--gold);vertical-align:middle;
    animation:blink 1s steps(1) infinite;
    margin-left:2px;
  }
  @keyframes blink{50%{opacity:0;}}

  .boot-bar-track{
    height:3px;background:var(--border);
    margin-top:18px;border-radius:2px;overflow:hidden;
  }
  .boot-bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--teal),var(--gold));
    transition:width 1.4s cubic-bezier(.16,.84,.32,1);
  }
  .boot-pct{
    margin-top:10px;font-size:11px;color:var(--text-faint);
    display:flex;justify-content:space-between;
  }

  #replay{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    z-index:3;
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;
    color:var(--text-faint);background:transparent;
    border:1px solid var(--border);padding:9px 16px;border-radius:20px;
    cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .5s ease, color .25s, border-color .25s;
  }
  #replay.show{opacity:1;pointer-events:auto;}
  #replay:hover{color:var(--gold);border-color:var(--gold);}
</style>
</head>
<body>

<div id="boot">
  <div id="boot-lines">
    <div data-line>&gt; SARBESH.OS v6.0<span class="cursor"></span></div>
    <div data-line>&gt; loading designer profile...</div>
    <div data-line>&gt; indexing 6 years of shipped systems...</div>
    <div data-line>&gt; calibrating pixels to purpose...</div>
    <div data-line>&gt; ready.</div>
  </div>
  <div class="boot-bar-track"><div class="boot-bar-fill" id="boot-bar"></div></div>
  <div class="boot-pct"><span id="boot-pct-label">0%</span><span>SARBESH.OS</span></div>
</div>

<button id="replay" type="button">↻ replay boot sequence</button>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lines = document.querySelectorAll('#boot-lines [data-line]');
  var bar = document.getElementById('boot-bar');
  var pctLabel = document.getElementById('boot-pct-label');
  var replayBtn = document.getElementById('replay');
  var pctRAF = null;

  function animatePct(){
    var start = null, dur = 1400;
    cancelAnimationFrame(pctRAF);
    function step(ts){
      if(!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      pctLabel.textContent = Math.round(p * 100) + '%';
      if(p < 1) pctRAF = requestAnimationFrame(step);
    }
    pctRAF = requestAnimationFrame(step);
  }

  function runBoot(){
    replayBtn.classList.remove('show');
    lines.forEach(function(l){ l.classList.remove('show'); });
    bar.style.width = '0%';
    pctLabel.textContent = '0%';

    if(reduceMotion){
      lines.forEach(function(l){ l.classList.add('show'); });
      bar.style.width = '100%';
      pctLabel.textContent = '100%';
      // If motion is reduced, redirect after a short pause
      setTimeout(redirectToMain, 800);
      return;
    }

    var delay = 0;
    lines.forEach(function(line){
      delay += 260;
      setTimeout(function(){ line.classList.add('show'); }, delay);
    });
    
    setTimeout(function(){
      bar.style.width = '100%';
      animatePct();
    }, delay + 150);

    // Redirect automatically once the full loader sequence completes
    setTimeout(redirectToMain, delay + 1800);
  }

  function redirectToMain() {
    window.location.href = 'home.html';
  }

  replayBtn.addEventListener('click', runBoot);
  runBoot();
})();
</script>

</body>
</html>
