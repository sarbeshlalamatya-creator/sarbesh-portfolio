<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>Kern Type · Sarbesh-OS</title>
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0C10'/%3E%3Cpath d='M8 8v16M24 8v16' stroke='%23CCFF00' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M11.5 16h9M14 13l-3 3 3 3M18 13l3 3-3 3' fill='none' stroke='%2300E5FF' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>window.react = window.React;</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root { color-scheme: dark; --bg:#0B0C10; --lime:#CCFF00; --blue:#00E5FF; --ink:#E8EAF0; --mute:#8B90A0; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1.2px),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 18px 18px, 90px 90px, 90px 90px;
    background-attachment: fixed;
    color: var(--ink); font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .f-display { font-family: "Chakra Petch", "DM Sans", ui-sans-serif, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }
  .os-window { border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 0 1px rgba(0,0,0,0.6); background: linear-gradient(180deg, #12141B 0%, #0E1015 100%); }
  .dots { background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1.2px); background-size: 18px 18px; }
  .stage-in { animation: stageIn .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes stageIn { from { opacity: 0; transform: translateY(10px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .toast-in { animation: toastIn .18s ease-out both; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .shake { animation: shake .35s ease-in-out; }
  @keyframes shake { 20%,60% { transform: translateX(-3px);} 40%,80% { transform: translateX(3px);} }
  .glyph:focus { outline: none; }
  .glyph:focus-visible .hit { stroke: var(--lime); stroke-width: 1; stroke-dasharray: 3 3; }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>

<div id="root" class="min-h-full"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const { Check, ArrowRight, RotateCcw, Lock, Layers, Eye, User, Keyboard, Trophy, Move } = LucideReact;

// ---- Dataset: every face is a real Google Font so metrics are measured, not faked ----
const WORDS = [
  { word: "YVES",     font: "EB Garamond",        weight: 400, stack: "Georgia, serif",   creator: "Georg Duffner",         year: 2011 },
  { word: "GARAMOND", font: "Cormorant Garamond", weight: 500, stack: "Georgia, serif",   creator: "Christian Thalmann",    year: 2015 },
  { word: "ROBOTO",   font: "Roboto",             weight: 500, stack: "Arial, sans-serif", creator: "Christian Robertson",  year: 2011 },
  { word: "WAVELET",  font: "Playfair Display",   weight: 700, stack: "Georgia, serif",   creator: "Claus Eggers Sørensen", year: 2011 },
  { word: "AVIATOR",  font: "Josefin Sans",       weight: 600, stack: "Arial, sans-serif", creator: "Santiago Orozco",      year: 2010 },
  { word: "LAYOUT",   font: "Bebas Neue",         weight: 400, stack: "Impact, sans-serif", creator: "Ryoichi Tsunekawa",   year: 2010 },
];

const EM = 100;                       // SVG user units per em
const PAD_X = 38;
const family = (e) => `"${e.font}", ${e.stack}`;

// Solution = the typeface designer's own spacing + kerning table, measured with canvas.
function measure(entry) {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = `${entry.weight} ${EM}px ${family(entry)}`;
  try { ctx.fontKerning = "normal"; } catch (_) {}
  const w = entry.word;
  const adv = [...w].map((ch) => ctx.measureText(ch).width);
  const sol = [...w].map((_, i) => ctx.measureText(w.slice(0, i + 1)).width - adv[i]);
  const total = ctx.measureText(w).width;
  const cap = ctx.measureText("H").actualBoundingBoxAscent || 70;
  const xh = ctx.measureText("x").actualBoundingBoxAscent || 48;
  return { adv, sol, total, cap, xh };
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function bounds(m, i) {
  const n = m.sol.length;
  return [m.sol[0] + m.adv[0] * 0.25, m.sol[n - 1] + m.adv[n - 1] * 0.75 - m.adv[i]];
}

function scramble(m) {
  const n = m.sol.length;
  let pos, err;
  do {
    pos = m.sol.map((x, i) => {
      if (i === 0 || i === n - 1) return x;
      const [lo, hi] = bounds(m, i);
      const kick = (Math.random() * 2 - 1) * 16 + (Math.random() < 0.5 ? -6 : 6);
      return clamp(x + kick, lo, hi);
    });
    err = avgError(pos, m.sol);
  } while (n > 2 && err < 6);
  return pos;
}

function avgError(pos, sol) {
  const mids = pos.slice(1, -1);
  if (!mids.length) return 0;
  return mids.reduce((s, x, k) => s + Math.abs(x - sol[k + 1]), 0) / mids.length;
}

const scoreFrom = (err) => Math.round(clamp(100 - err * 2.1, 0, 100));
const verdict = (s) => s >= 95 ? "Pixel-perfect optical spacing" : s >= 85 ? "Sharp eye — even texture"
  : s >= 70 ? "Decent rhythm, a few gaps" : s >= 50 ? "Uneven color across the word" : "Keep training those eyes";

// ---------------------------------------------------------------------------------------

function KernType() {
  const [ready, setReady] = useState(false);
  const [metrics, setMetrics] = useState([]);
  const [round, setRound] = useState(0);
  const [pos, setPos] = useState([]);
  const [selected, setSelected] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [view, setView] = useState("both");
  const [scores, setScores] = useState([]);
  const [toast, setToast] = useState(null);
  const [finished, setFinished] = useState(false);
  const svgRef = useRef(null);
  const drag = useRef(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    let alive = true;
    Promise.all(WORDS.map((e) => document.fonts.load(`${e.weight} ${EM}px "${e.font}"`, e.word).catch(() => null)))
      .then(() => document.fonts.ready)
      .then(() => {
        if (!alive) return;
        const ms = WORDS.map(measure);
        setMetrics(ms);
        setPos(scramble(ms[0]));
        setReady(true);
      });
    return () => { alive = false; };
  }, []);

  const entry = WORDS[round];
  const m = metrics[round];
  const n = entry.word.length;

  const startRound = useCallback((r) => {
    setRound(r);
    setPos(scramble(metrics[r]));
    setSubmitted(false);
    setSelected(null);
    setView("both");
    setToast(null);
  }, [metrics]);

  const showLocked = (i) => {
    clearTimeout(toastTimer.current);
    setToast({ i, id: Date.now() });
    toastTimer.current = setTimeout(() => setToast(null), 1500);
  };

  const onDown = (i, e) => {
    if (submitted) return;
    if (i === 0 || i === n - 1) { showLocked(i); return; }
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    e.currentTarget.focus({ preventScroll: true });
    drag.current = { i, x0: e.clientX, orig: pos[i], scale: svgRef.current.getScreenCTM().a };
    setSelected(i);
    setDragging(true);
  };
  const onMove = (e) => {
    const d = drag.current;
    if (!d) return;
    const [lo, hi] = bounds(m, d.i);
    const x = clamp(d.orig + (e.clientX - d.x0) / d.scale, lo, hi);
    setPos((p) => { const q = [...p]; q[d.i] = x; return q; });
  };
  const onUp = () => { drag.current = null; setDragging(false); };

  const nudge = (i, dir, big) => {
    const [lo, hi] = bounds(m, i);
    setPos((p) => { const q = [...p]; q[i] = clamp(q[i] + dir * (big ? 5 : 1), lo, hi); return q; });
  };
  const onKey = (i, e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    if (submitted) return;
    if (i === 0 || i === n - 1) { showLocked(i); return; }
    nudge(i, e.key === "ArrowLeft" ? -1 : 1, e.shiftKey);
  };

  const done = () => {
    const s = scoreFrom(avgError(pos, m.sol));
    setScores((arr) => { const a = [...arr]; a[round] = s; return a; });
    setSubmitted(true);
    setSelected(null);
  };
  const next = () => {
    if (round < WORDS.length - 1) startRound(round + 1);
    else setFinished(true);
  };
  const restart = () => { setScores([]); setFinished(false); startRound(0); };

  // ---- geometry ----
  const vb = m && {
    x: -PAD_X, w: m.total + PAD_X * 2,
    y: -m.cap - 34, h: m.cap + 34 + 44,
  };
  const pctX = (x) => ((x - vb.x) / vb.w) * 100;
  const pctY = (y) => ((y - vb.y) / vb.h) * 100;

  const score = scores[round];
  const showUser = !submitted || view !== "solution";
  const showSol = submitted && view !== "yours";
  const ease = dragging ? "none" : "transform .5s cubic-bezier(.2,.8,.2,1)";

  return (
    <div className="min-h-full w-full flex items-center justify-center px-4 py-8 sm:py-12">
      <div className="os-window w-full max-w-5xl rounded-2xl overflow-hidden">

        {/* Title bar */}
        <div className="flex flex-wrap items-center gap-3 border-b border-white/10 bg-[#0D0F14] px-4 py-2.5">
          <div className="flex gap-1.5 shrink-0" aria-hidden="true">
            <span className="w-3 h-3 rounded-full bg-[#FF3366]"></span>
            <span className="w-3 h-3 rounded-full bg-[#FFB020]"></span>
            <span className="w-3 h-3 rounded-full bg-[#CCFF00]"></span>
          </div>
          <span className="mono text-[12px] text-[var(--mute)] truncate">~/sarbesh-os/apps/<span className="text-[#E8EAF0]">kern_type</span>.exe</span>
          <span className="mono ml-auto text-[11px] px-3 py-1 rounded-full border border-[#CCFF00]/30 bg-[#CCFF00]/[0.07] text-[#CCFF00] whitespace-nowrap">
            Sarbesh Lal Amatya
          </span>
        </div>

        {/* Round header */}
        <div className="flex flex-wrap items-end justify-between gap-4 px-4 sm:px-6 pt-6">
          <div>
            <div className="mono text-[11px] tracking-[0.2em] text-[#CCFF00] uppercase">Kerning game · typography</div>
            <h1 className="f-display text-[34px] sm:text-[42px] font-bold tracking-tight leading-none mt-1">
              Kern Type<span className="text-[#CCFF00]">_</span>
            </h1>
          </div>
          <div className="flex items-center gap-3">
            <span className="mono text-[11px] text-[var(--mute)] tabular-nums">WORD {String(round + 1).padStart(2, "0")}/{String(WORDS.length).padStart(2, "0")}</span>
            <div className="flex gap-1" aria-hidden="true">
              {WORDS.map((_, i) => (
                <span key={i} className="h-1.5 w-5 sm:w-7 rounded-full transition-colors"
                  style={{ background: scores[i] != null ? "#CCFF00" : i === round ? "rgba(204,255,0,.35)" : "rgba(255,255,255,.1)" }}></span>
              ))}
            </div>
          </div>
        </div>

        {/* Stage */}
        <div className="px-4 sm:px-6 pt-4">
          <div className="relative rounded-xl border border-white/[0.07] dots overflow-hidden" style={{ background: "#0B0C10" }}>
            {!ready && (
              <div className="h-64 flex items-center justify-center mono text-xs text-[var(--mute)] tracking-widest">LOADING TYPEFACES…</div>
            )}
            {ready && finished && (
              <Summary scores={scores} onRestart={restart} />
            )}
            {ready && !finished && m && (
              <div key={round} className="stage-in relative px-2 sm:px-8 py-8 sm:py-12">
                <div className="relative max-w-3xl mx-auto">
                  <svg ref={svgRef} viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`} className="block w-full h-auto select-none"
                       style={{ touchAction: "none", overflow: "visible" }} role="group" aria-label={`Word ${entry.word}`}>
                    {/* typographic guides */}
                    {[
                      { y: -m.cap, c: "rgba(255,255,255,.16)" },
                      { y: -m.xh, c: "rgba(255,255,255,.07)", dash: "4 5" },
                      { y: 0, c: "rgba(204,255,0,.45)" },
                      { y: 22, c: "rgba(255,255,255,.06)", dash: "2 6" },
                    ].map((g, k) => (
                      <line key={k} x1={vb.x - 400} x2={vb.x + vb.w + 400} y1={g.y} y2={g.y} stroke={g.c}
                            strokeDasharray={g.dash} strokeWidth="1" vectorEffect="non-scaling-stroke" />
                    ))}

                    {/* delta markers between yours and the solution */}
                    {submitted && view === "both" && pos.map((x, i) => (i > 0 && i < n - 1 && Math.abs(x - m.sol[i]) > 0.5) && (
                      <g key={"d" + i}>
                        <line x1={x} x2={m.sol[i]} y1={12} y2={12} stroke="#00E5FF" strokeWidth="2" vectorEffect="non-scaling-stroke" />
                        <line x1={m.sol[i]} x2={m.sol[i]} y1={6} y2={18} stroke="#00E5FF" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                        <line x1={x} x2={x} y1={8} y2={16} stroke="rgba(255,255,255,.55)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                      </g>
                    ))}

                    {/* solution layer */}
                    {showSol && m.sol.map((x, i) => (
                      <text key={"s" + i} x="0" y="0" style={{ transform: `translateX(${x}px)`, transition: ease, fontFamily: family(entry), fontWeight: entry.weight, fontKerning: "none", mixBlendMode: "screen" }}
                            fontSize={EM} fill={view === "both" ? "rgba(0,229,255,.55)" : "#00E5FF"}
                            stroke={view === "both" ? "#00E5FF" : "none"} strokeWidth={view === "both" ? 0.8 : 0}>
                        {entry.word[i]}
                      </text>
                    ))}

                    {/* user layer */}
                    {showUser && pos.map((x, i) => {
                      const locked = i === 0 || i === n - 1;
                      const sel = selected === i && !submitted;
                      return (
                        <g key={"u" + i} className="glyph" tabIndex={submitted ? -1 : 0}
                           aria-label={locked ? `${entry.word[i]}, locked` : `${entry.word[i]}, movable`}
                           style={{ transform: `translateX(${x}px)`, transition: ease, cursor: submitted ? "default" : locked ? "not-allowed" : dragging ? "grabbing" : "ew-resize" }}
                           onPointerDown={(e) => onDown(i, e)} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                           onFocus={() => !locked && !submitted && setSelected(i)} onKeyDown={(e) => onKey(i, e)}>
                          <rect className="hit" x={0} y={-m.cap - 14} width={m.adv[i]} height={m.cap + 34} fill="transparent" />
                          {sel && <rect x={0} y={-m.cap - 14} width={m.adv[i]} height={m.cap + 34} fill="rgba(204,255,0,.06)" />}
                          <text x="0" y="0" fontSize={EM}
                                className={toast && toast.i === i ? "shake" : ""} key={toast && toast.i === i ? toast.id : "t"}
                                style={{ fontFamily: family(entry), fontWeight: entry.weight, fontKerning: "none" }}
                                fill={submitted ? (view === "both" ? "rgba(255,255,255,.88)" : "#F2F4F8") : sel ? "#CCFF00" : locked ? "rgba(232,234,240,.55)" : "#F2F4F8"}>
                            {entry.word[i]}
                          </text>
                          {sel && <path d={`M ${m.adv[i] / 2 - 5} 30 l 5 -7 l 5 7 z`} fill="#CCFF00" />}
                        </g>
                      );
                    })}
                  </svg>

                  {/* guide labels */}
                  <span className="hidden sm:block absolute -left-8 mono text-[9px] tracking-widest text-white/30 -translate-y-full pb-0.5" style={{ top: `${pctY(-m.cap)}%` }}>CAP</span>
                  <span className="hidden sm:block absolute -left-8 mono text-[9px] tracking-widest text-[#CCFF00]/60 -translate-y-full pb-0.5" style={{ top: `${pctY(0)}%` }}>BASE</span>

                  {/* lock markers under the fixed letters */}
                  {!submitted && [0, n - 1].map((i) => (
                    <span key={"l" + i} className="absolute -translate-x-1/2 text-white/30" style={{ left: `${pctX(pos[i] + m.adv[i] / 2)}%`, top: `${pctY(30)}%` }}>
                      <Lock size={12} strokeWidth={2} />
                    </span>
                  ))}

                  {/* locked toast */}
                  {toast && (
                    <div key={toast.id} role="status" className="toast-in absolute z-10 -translate-x-1/2 whitespace-nowrap mono text-[11px] px-3 py-1.5 rounded-md bg-[#1A1D24] border border-white/15 text-white shadow-lg flex items-center gap-1.5"
                         style={{ left: `${pctX(pos[toast.i] + m.adv[toast.i] / 2)}%`, top: `${Math.max(0, pctY(-m.cap) - 14)}%` }}>
                      <Lock size={12} className="text-[#CCFF00]" /> Letter can't be moved
                    </div>
                  )}
                </div>

                {/* in-stage legend after submit */}
                {submitted && (
                  <div className="absolute right-3 top-3 flex items-center gap-3 mono text-[10px] text-[var(--mute)]">
                    {view !== "solution" && <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-sm bg-white/85"></i>YOURS</span>}
                    {view !== "yours" && <span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-sm bg-[#00E5FF]"></i>SOLUTION</span>}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>

        {/* Hint / score strip */}
        <div className="px-4 sm:px-6 pt-4 min-h-[3.25rem] flex items-center">
          {!submitted || finished ? (
            <p className="text-sm text-[var(--mute)] flex flex-wrap items-center gap-x-4 gap-y-1">
              <span className="flex items-center gap-1.5"><Move size={14} className="text-[#CCFF00]" /> Drag the middle letters until the spacing looks even.</span>
              <span className="flex items-center gap-1.5 mono text-[11px]"><Keyboard size={14} /> ← → nudge · Shift ×5</span>
            </p>
          ) : (
            <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1">
              <span className="mono font-bold text-3xl sm:text-4xl text-[#CCFF00] tabular-nums leading-none">{score}<span className="text-white/30 text-xl"> / 100</span></span>
              <span className="text-sm text-white/80">{verdict(score)}</span>
            </div>
          )}
        </div>

        {/* Footer: metadata + controls */}
        <div className="flex flex-wrap items-center justify-between gap-4 px-4 sm:px-6 py-5 mt-1 border-t border-white/[0.06]">
          <div className="mono text-[11px] flex flex-wrap items-center gap-x-4 gap-y-1 px-4 py-2 rounded-full bg-black/50 border border-white/10">
            <span><span className="text-[var(--mute)]">TYPEFACE </span><span className="text-white">{entry.font}</span></span>
            <span><span className="text-[var(--mute)]">BY </span><span className="text-white">{entry.creator}</span></span>
            <span><span className="text-[var(--mute)]">YEAR </span><span className="text-white tabular-nums">{entry.year}</span></span>
          </div>

          {!finished && (
            <div className="flex flex-wrap items-center gap-2">
              {!submitted ? (
                <>
                  <button onClick={() => { setPos(scramble(m)); setSelected(null); }} disabled={!ready}
                          className="h-10 px-3 rounded-lg border border-white/10 text-[var(--mute)] hover:text-white hover:border-white/25 transition-colors flex items-center gap-2 text-sm">
                    <RotateCcw size={15} /> Reset
                  </button>
                  <button onClick={done} disabled={!ready}
                          className="h-10 px-6 rounded-lg bg-[#CCFF00] text-black font-bold tracking-[0.15em] text-sm flex items-center gap-2 hover:brightness-110 active:translate-y-px transition shadow-[0_0_24px_rgba(204,255,0,.25)]">
                    <Check size={16} strokeWidth={3} /> DONE
                  </button>
                </>
              ) : (
                <>
                  <div className="flex p-1 rounded-lg bg-black/50 border border-white/10" role="radiogroup" aria-label="Comparison view">
                    {[["both", "Both", Layers], ["solution", "Solution", Eye], ["yours", "Your Spacing", User]].map(([k, label, Icon]) => (
                      <button key={k} role="radio" aria-checked={view === k} onClick={() => setView(k)}
                              className={`h-8 px-3 rounded-md text-xs flex items-center gap-1.5 transition-colors ${view === k ? (k === "solution" ? "bg-[#00E5FF] text-black font-semibold" : "bg-white/10 text-white font-semibold") : "text-[var(--mute)] hover:text-white"}`}>
                        <Icon size={13} /> {label}
                      </button>
                    ))}
                  </div>
                  <button onClick={next}
                          className="h-10 px-6 rounded-lg bg-[#CCFF00] text-black font-bold tracking-[0.15em] text-sm flex items-center gap-2 hover:brightness-110 active:translate-y-px transition shadow-[0_0_24px_rgba(204,255,0,.25)]">
                    {round < WORDS.length - 1 ? "NEXT" : "RESULTS"} <ArrowRight size={16} strokeWidth={3} />
                  </button>
                </>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Summary({ scores, onRestart }) {
  const avg = Math.round(scores.reduce((a, b) => a + (b || 0), 0) / WORDS.length);
  return (
    <div className="stage-in px-4 sm:px-8 py-10 flex flex-col items-center text-center gap-6">
      <Trophy size={28} className="text-[#CCFF00]" />
      <div>
        <div className="mono text-[10px] tracking-[0.25em] text-[var(--mute)]">AVERAGE SCORE</div>
        <div className="mono font-bold text-5xl sm:text-6xl text-[#CCFF00] tabular-nums mt-2">{avg}<span className="text-white/30 text-2xl"> / 100</span></div>
        <div className="text-sm text-white/75 mt-2">{verdict(avg)}</div>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 w-full max-w-lg">
        {WORDS.map((w, i) => (
          <div key={w.word} className="rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-left">
            <div className="text-lg leading-tight truncate" style={{ fontFamily: family(w), fontWeight: w.weight }}>{w.word}</div>
            <div className="mono text-[11px] text-[var(--mute)] flex justify-between"><span className="truncate">{w.font}</span><span className="text-[#CCFF00] tabular-nums ml-2">{scores[i] ?? "–"}</span></div>
          </div>
        ))}
      </div>
      <button onClick={onRestart}
              className="h-10 px-6 rounded-lg bg-[#CCFF00] text-black font-bold tracking-[0.15em] text-sm flex items-center gap-2 hover:brightness-110 transition">
        <RotateCcw size={16} strokeWidth={3} /> PLAY AGAIN
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KernType />);
</script>
</body>
</html>
